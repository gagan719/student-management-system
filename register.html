        <body>

<div class="container">
    <h2>Student Registration</h2>

    <form>
        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email" required>

        <input type="text" placeholder="Student ID" required>

        <input type="text" placeholder="Department" required>

        <input type="password" placeholder="Password" required><i class="fa-solid fa-eye" id="eye"></i>
        
        <input type="password" placeholder="Confirm Password" required><i class="fa-solid fa-eye" id="eye"></i>
        
        <button type="submit">Register</button>
    </form>

    <p>Already have an account?
        login in here
        <a href="student management.html">Login</a>
    </p>
</div>
